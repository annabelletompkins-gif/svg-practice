<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <title>A pelican riding a bicycle</title>
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#81d4fa"/>
      <stop offset="1" stop-color="#e1f5fe"/>
    </linearGradient>
  </defs>
  <rect width="900" height="600" fill="url(#sky2)"/>
  <circle cx="790" cy="90" r="45" fill="#ffca28"/>
  <path d="M0 480 L900 480 L900 600 L0 600 Z" fill="#8bc34a"/>
  <path d="M0 470 L900 470 L900 482 L0 482 Z" fill="#6d4c41"/>

  <!-- bicycle -->
  <g>
    <circle cx="280" cy="430" r="75" fill="none" stroke="#263238" stroke-width="10"/>
    <circle cx="280" cy="430" r="66" fill="none" stroke="#b0bec5" stroke-width="2"/>
    <circle cx="640" cy="430" r="75" fill="none" stroke="#263238" stroke-width="10"/>
    <circle cx="640" cy="430" r="66" fill="none" stroke="#b0bec5" stroke-width="2"/>
    <g stroke="#263238" stroke-width="7" stroke-linecap="round" fill="none">
      <path d="M280 430 L430 430 L360 300"/>
      <path d="M360 300 L640 430"/>
      <path d="M360 300 L430 430"/>
      <path d="M360 300 L350 265"/>
      <path d="M330 265 L380 265"/>
      <path d="M640 430 L625 290"/>
      <path d="M610 285 L650 285"/>
    </g>
    <circle cx="430" cy="430" r="18" fill="none" stroke="#263238" stroke-width="6"/>
    <line x1="430" y1="430" x2="470" y2="470" stroke="#263238" stroke-width="6" stroke-linecap="round"/>
    <rect x="455" y="462" width="26" height="10" rx="5" fill="#263238"/>
    <line x1="430" y1="430" x2="400" y2="395" stroke="#263238" stroke-width="6" stroke-linecap="round"/>
    <rect x="380" y="385" width="26" height="10" rx="5" fill="#263238" transform="rotate(-35 393 390)"/>
  </g>

  <!-- pelican -->
  <g>
    <!-- tail -->
    <path d="M330 300 Q290 285 270 300 Q295 310 325 320 Z" fill="#e0e0e0"/>
    <!-- body -->
    <ellipse cx="400" cy="300" rx="70" ry="45" fill="#f5f5f5" stroke="#cfcfcf" stroke-width="2"/>
    <!-- wing -->
    <path d="M370 285 Q420 260 460 300 Q420 315 370 300 Z" fill="#eceff1" stroke="#b0bec5" stroke-width="2"/>
    <!-- neck -->
    <path d="M450 270 Q470 230 465 190 Q470 175 485 170 L490 190 Q490 230 475 275 Z" fill="#f5f5f5" stroke="#cfcfcf" stroke-width="2"/>
    <!-- head -->
    <ellipse cx="495" cy="168" rx="26" ry="20" fill="#f5f5f5" stroke="#cfcfcf" stroke-width="2"/>
    <!-- beak + pouch -->
    <path d="M515 160 L560 172 Q560 200 515 195 Z" fill="#ffb300"/>
    <path d="M515 178 Q545 205 515 195 Q510 190 515 178 Z" fill="#ff8f00"/>
    <!-- eye -->
    <circle cx="502" cy="162" r="4" fill="#212121"/>
    <!-- legs to pedals -->
    <path d="M420 335 Q440 380 470 470" fill="none" stroke="#ffb300" stroke-width="9" stroke-linecap="round"/>
    <path d="M410 335 Q430 360 400 395" fill="none" stroke="#ffb300" stroke-width="9" stroke-linecap="round"/>
    <!-- foot on pedal -->
    <ellipse cx="475" cy="476" rx="14" ry="7" fill="#ff8f00"/>
  </g>
</svg>
